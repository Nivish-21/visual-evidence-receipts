name: CI
on: [push]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format
      - run: npm run build
      - run: |
          pattern='AI''za|gh''p_|gh''o_|0x[a-fA-F0-9]{64}'
          if git grep -nE "$pattern" -- . ':!README.md' ':!.env.example'; then
            exit 1
          fi
