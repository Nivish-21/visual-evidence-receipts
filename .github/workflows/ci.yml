name: CI
on: [push]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format
      - run: npm run build
      - run: git grep -nE 'AIza|ghp_|gho_|0x[a-fA-F0-9]{64}' -- . ':!README.md' ':!.env.example' && exit 1 || exit 0
